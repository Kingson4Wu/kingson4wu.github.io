<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Dense and Sparse mental model</title>
  <desc id="desc">Dense provides semantic understanding, Sparse provides selective activation, and Hybrid systems combine both.</desc>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <rect x="70" y="70" width="1060" height="480" rx="24" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="600" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18212f">Dense + Sparse</text>
  <text x="600" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5f6b7a">Understand broadly, activate selectively</text>

  <rect x="130" y="230" width="330" height="190" rx="18" fill="#e8f2ff" stroke="#6b9bd8" stroke-width="2"/>
  <text x="295" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f4f82">Dense</text>
  <text x="295" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#365f86">semantic space</text>
  <text x="295" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#365f86">similarity</text>
  <text x="295" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#365f86">overall meaning</text>

  <path d="M485 325 H715" stroke="#8a94a6" stroke-width="4" stroke-linecap="round"/>
  <path d="M700 305 L730 325 L700 345" fill="none" stroke="#8a94a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5f6b7a">hybrid</text>

  <rect x="740" y="230" width="330" height="190" rx="18" fill="#fff4df" stroke="#d69d42" stroke-width="2"/>
  <text x="905" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#895d16">Sparse</text>
  <text x="905" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7b5a24">exact features</text>
  <text x="905" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7b5a24">routing</text>
  <text x="905" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7b5a24">less wasted compute</text>

  <rect x="390" y="462" width="420" height="54" rx="27" fill="#e9f7ef" stroke="#5ca879" stroke-width="2"/>
  <text x="600" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#25643d">Use Dense to understand, use Sparse to choose</text>
</svg>
