<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sisyphus and the absurd</title>
  <desc id="desc">A small figure pushes a stone uphill between the human search for meaning and the silent world.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef4f8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="url(#sky)"/>
  <rect x="70" y="60" width="1060" height="500" rx="24" fill="#ffffff" stroke="#d8dee9" stroke-width="2" filter="url(#softShadow)"/>

  <text x="600" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#18212f">西西弗神话</text>
  <text x="600" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5f6b7a">人追问意义，世界保持沉默，荒诞由此发生</text>

  <path d="M150 456 C335 420 470 352 590 292 C730 222 860 190 1025 174" fill="none" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
  <path d="M150 460 C338 424 473 356 592 296 C732 226 862 194 1025 178" fill="none" stroke="#7b8794" stroke-width="3" stroke-linecap="round"/>

  <circle cx="680" cy="248" r="47" fill="#475569"/>
  <circle cx="665" cy="234" r="12" fill="#64748b" opacity="0.45"/>
  <circle cx="700" cy="262" r="9" fill="#334155" opacity="0.28"/>

  <circle cx="604" cy="330" r="13" fill="#18212f"/>
  <path d="M604 344 L588 395" stroke="#18212f" stroke-width="10" stroke-linecap="round"/>
  <path d="M596 358 L640 292" stroke="#18212f" stroke-width="9" stroke-linecap="round"/>
  <path d="M587 395 L555 429" stroke="#18212f" stroke-width="9" stroke-linecap="round"/>
  <path d="M591 394 L621 429" stroke="#18212f" stroke-width="9" stroke-linecap="round"/>

  <path d="M198 254 C282 218 365 218 444 253" fill="none" stroke="#6b9bd8" stroke-width="4" stroke-linecap="round"/>
  <path d="M756 394 C842 427 930 426 1015 392" fill="none" stroke="#d69d42" stroke-width="4" stroke-linecap="round"/>
  <path d="M522 482 H677" fill="none" stroke="#5ca879" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="140" y="210" width="300" height="90" rx="14" fill="#e8f2ff" stroke="#6b9bd8" stroke-width="2"/>
  <text x="290" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f4f82">人追问意义</text>
  <text x="290" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#365f86">清晰、解释、公平、目的</text>

  <rect x="720" y="350" width="300" height="90" rx="14" fill="#fff4df" stroke="#d69d42" stroke-width="2"/>
  <text x="870" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#895d16">世界保持沉默</text>
  <text x="870" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7b5a24">偶然、死亡、不可解释</text>

  <rect x="440" y="457" width="300" height="58" rx="29" fill="#e9f7ef" stroke="#5ca879" stroke-width="2"/>
  <text x="590" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#25643d">反抗、自由、激情</text>
</svg>
