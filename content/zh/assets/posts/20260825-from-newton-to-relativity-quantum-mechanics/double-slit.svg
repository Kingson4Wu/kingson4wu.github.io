    <circle cx="694" cy="296" r="3.5"/><circle cx="694" cy="304" r="3.5"/>
  </g>
  <rect x="752" y="104" width="28" height="44" rx="5" fill="#173f63"/>
  <rect x="752" y="168" width="28" height="18" rx="5" fill="#89a6bd"/>
  <rect x="752" y="204" width="28" height="44" rx="5" fill="#173f63"/>
