<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
  <title id="title">牛顿力学、相对论和量子力学的适用范围</title>
  <desc id="desc">三套理论分别对应宏观低速、高速强引力和微观世界，并不是简单互相推翻。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#173f63"/>
    </marker>
  </defs>
  <rect width="940" height="520" rx="16" fill="#fbf7ef"/>
  <text x="470" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#173f63">A wider range, not a replacement chain</text>
  <rect x="70" y="96" width="250" height="304" rx="8" fill="#fffdf8" stroke="#173f63" stroke-width="1.35"/>
  <rect x="345" y="96" width="250" height="304" rx="8" fill="#fffdf8" stroke="#173f63" stroke-width="1.35"/>
  <rect x="620" y="96" width="250" height="304" rx="8" fill="#fffdf8" stroke="#173f63" stroke-width="1.35"/>
  <text x="195" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#173f63">N</text>
  <text x="470" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#173f63">R</text>
  <text x="745" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#173f63">Q</text>
  <line x1="150" y1="160" x2="240" y2="160" stroke="#173f63" stroke-width="1.3"/>
  <line x1="425" y1="160" x2="515" y2="160" stroke="#173f63" stroke-width="1.3"/>
  <line x1="700" y1="160" x2="790" y2="160" stroke="#173f63" stroke-width="1.3"/>
  <text x="195" y="204" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#173f63">牛顿力学</text>
  <text x="470" y="204" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#173f63">相对论</text>
  <text x="745" y="204" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#173f63">量子力学</text>
  <text x="195" y="246" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#173f63">宏观、低速、弱引力</text>
  <text x="470" y="246" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#173f63">高速、强引力、时空</text>
  <text x="745" y="246" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#173f63">原子、电子、光子</text>
  <line x1="122" y1="300" x2="268" y2="300" stroke="#1f7a57" stroke-width="4" stroke-linecap="round"/>
  <circle cx="170" cy="300" r="9" fill="#1f7a57"/>
  <path d="M 398 306 C 432 250 508 250 542 306" fill="none" stroke="#173f63" stroke-width="4" stroke-linecap="round"/>
  <circle cx="398" cy="306" r="7" fill="#173f63"/>
  <circle cx="542" cy="306" r="7" fill="#173f63"/>
  <path d="M 674 300 C 690 248 724 248 744 300 C 764 352 798 352 816 300" fill="none" stroke="#9a3b2f" stroke-width="4" stroke-linecap="round"/>
  <text x="195" y="354" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#173f63">确定状态与受力规律</text>
  <text x="470" y="354" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#173f63">时间与空间随条件改变</text>
  <text x="745" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#173f63">量子态、概率、干涉</text>
  <line x1="320" y1="248" x2="342" y2="248" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595" y1="248" x2="617" y2="248" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="174" y="438" width="592" height="36" rx="8" fill="#fffdf8" stroke="#173f63" stroke-width="1.2"/>
  <text x="470" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#173f63">旧理论在自身适用范围内仍然有效，新理论给出更一般的描述。</text>
</svg>
