<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">基督教历史发展时间线</title>
  <desc id="desc">从公元一世纪耶稣死亡和门徒传播，到罗马时期、380 年成为官方宗教、1054 年东西教会分裂、16 世纪宗教改革的时间线。</desc>
  <rect width="920" height="420" fill="#fbf7ef"/>
  <style>
    .title{font:700 30px Georgia,"Times New Roman","Noto Serif CJK SC",serif;fill:#173f63}
    .axis{stroke:#173f63;stroke-width:2;fill:none}
    .dot{fill:#fffdf8;stroke:#173f63;stroke-width:2}
    .dot-green{fill:#eef6f1;stroke:#1f7a57;stroke-width:2}
    .dot-red{fill:#f8efed;stroke:#9a3b2f;stroke-width:2}
    .card{fill:#fffdf8;stroke:#173f63;stroke-width:1.3;rx:8}
    .year{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#173f63}
    .label{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#425a6d}
    .small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#6f7f8d}
  </style>
  <text x="460" y="48" text-anchor="middle" class="title">基督教历史发展时间线</text>
  <path d="M95 210H825" class="axis"/>

  <circle cx="120" cy="210" r="10" class="dot-green"/>
  <rect x="45" y="88" width="150" height="86" class="card"/>
  <text x="120" y="116" text-anchor="middle" class="year">公元 1 世纪</text>
  <text x="120" y="142" text-anchor="middle" class="label">早期基督教</text>
  <text x="120" y="162" text-anchor="middle" class="small">门徒传播信仰</text>
  <path d="M120 174V198" class="axis"/>

  <circle cx="300" cy="210" r="10" class="dot-red"/>
  <rect x="225" y="246" width="150" height="86" class="card"/>
  <text x="300" y="274" text-anchor="middle" class="year">罗马时期</text>
  <text x="300" y="300" text-anchor="middle" class="label">最初受迫害</text>
  <text x="300" y="320" text-anchor="middle" class="small">拒绝崇拜皇帝</text>
  <path d="M300 222V246" class="axis"/>

  <circle cx="480" cy="210" r="10" class="dot-green"/>
  <rect x="405" y="88" width="150" height="86" class="card"/>
  <text x="480" y="116" text-anchor="middle" class="year">380 年</text>
  <text x="480" y="142" text-anchor="middle" class="label">罗马官方宗教</text>
  <text x="480" y="162" text-anchor="middle" class="small">进入帝国秩序</text>
  <path d="M480 174V198" class="axis"/>

  <circle cx="660" cy="210" r="10" class="dot"/>
  <rect x="585" y="246" width="150" height="86" class="card"/>
  <text x="660" y="274" text-anchor="middle" class="year">1054 年</text>
  <text x="660" y="300" text-anchor="middle" class="label">东西教会分裂</text>
  <text x="660" y="320" text-anchor="middle" class="small">天主教 / 东正教</text>
  <path d="M660 222V246" class="axis"/>

  <circle cx="820" cy="210" r="10" class="dot"/>
  <rect x="745" y="88" width="150" height="86" class="card"/>
  <text x="820" y="116" text-anchor="middle" class="year">16 世纪</text>
  <text x="820" y="142" text-anchor="middle" class="label">宗教改革</text>
  <text x="820" y="162" text-anchor="middle" class="small">马丁·路德 / 新教</text>
  <path d="M820 174V198" class="axis"/>
</svg>
