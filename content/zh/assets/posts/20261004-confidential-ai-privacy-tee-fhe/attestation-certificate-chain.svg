<svg xmlns="http://www.w3.org/2000/svg" width="480" height="544" viewBox="0 0 480 544" role="img" aria-labelledby="title desc"><title id="title">硬件证明 · 验证签名来源</title><desc id="desc">AMD 根证书认证中间证书，中间证书认证 VCEK 证书，VCEK 对应的受保护私钥签名证明报告。客户从预先信任的根证书开始验证。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#89a6bd"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#173f63}.title{font-family:Georgia,"Songti SC",serif;font-size:27px;font-weight:700}.label{font-size:24px;font-weight:600}.note{font-size:22px;fill:#52697b}.card{fill:#fffdf8;stroke:#89a6bd;stroke-width:1.3}.arrow{fill:none;stroke:#89a6bd;stroke-width:1.8;marker-end:url(#arrow)}</style>

<rect width="480" height="544" rx="16" fill="#fbf7ef"/>
<text x="240" y="46" class="title" text-anchor="middle">硬件证明 · 验证签名来源</text>
<rect x="28" y="82" width="424" height="76" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.3"/>
<text x="240" y="113" class="label" text-anchor="middle">AMD 根证书</text>
<text x="240" y="142" class="note" text-anchor="middle">客户预先信任的根</text>
<path d="M240 158 V183" class="arrow"/>
<rect x="28" y="192" width="424" height="76" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.3"/>
<text x="240" y="223" class="label" text-anchor="middle">AMD 中间证书</text>
<text x="240" y="252" class="note" text-anchor="middle">由根证书对应密钥认证</text>
<path d="M240 268 V293" class="arrow"/>
<rect x="28" y="302" width="424" height="76" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.3"/>
<text x="240" y="333" class="label" text-anchor="middle">硬件证明密钥证书</text>
<text x="240" y="362" class="note" text-anchor="middle">由中间证书对应密钥认证</text>
<path d="M240 378 V403" class="arrow"/>
<rect x="28" y="412" width="424" height="76" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.3"/>
<text x="240" y="443" class="label" text-anchor="middle">带签名的证明报告</text>
<text x="240" y="472" class="note" text-anchor="middle">用证明公钥验证报告签名</text>
</svg>
