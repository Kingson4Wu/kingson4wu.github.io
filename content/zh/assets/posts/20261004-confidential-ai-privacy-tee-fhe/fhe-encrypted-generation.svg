<svg xmlns="http://www.w3.org/2000/svg" width="480" height="740" viewBox="0 0 480 740" role="img" aria-labelledby="title desc"><title id="title">全密文生成：选择与循环</title><desc id="desc">服务器计算加密分数，通过同态比较选择加密token，再得到加密词向量与缓存以继续生成。客户只在最后解密。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#89a6bd"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#173f63;text-anchor:middle}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:600}.note{font-size:22px;fill:#52697b}.arrow{fill:none;stroke:#89a6bd;stroke-width:1.8;marker-end:url(#arrow)}</style><rect width="480" height="740" rx="16" fill="#fbf7ef"/><text x="240" y="46" class="title">全密文生成 · 选择与循环</text><rect x="20" y="76" width="440" height="526" rx="14" fill="#edf4f7" stroke="#89a6bd" stroke-dasharray="6 5"/><text x="240" y="111" class="label">服务端 · 全程无需解密</text><rect x="62" y="136" width="356" height="80" rx="12" fill="#fffdf8" stroke="#89a6bd"/><text x="240" y="168" class="label">加密输入 + 加密缓存</text><text x="240" y="198" class="note">执行同态模型计算</text><path d="M240 216 V246" class="arrow"/><rect x="62" y="248" width="356" height="80" rx="12" fill="#fffdf8" stroke="#89a6bd"/><text x="240" y="280" class="label">加密候选分数</text><text x="240" y="310" class="note">比较结果仍是加密的 0 / 1</text><path d="M240 328 V358" class="arrow"/><rect x="62" y="360" width="356" height="80" rx="12" fill="#fffdf8" stroke="#89a6bd"/><text x="240" y="392" class="label">加密 token / 选择向量</text><text x="240" y="422" class="note">同态选择：无需读出结果</text><path d="M240 440 V470" class="arrow"/><rect x="62" y="472" width="356" height="80" rx="12" fill="#fffdf8" stroke="#89a6bd"/><text x="240" y="504" class="label">加密词向量 + 更新缓存</text><text x="240" y="534" class="note">选出下一轮输入，保持加密</text><path d="M62 512 H40 V176 H60" class="arrow"/><text x="240" y="582" class="note">继续下一轮，按协议处理结束条件</text><path d="M240 602 V630" class="arrow"/><rect x="28" y="634" width="424" height="80" rx="12" fill="#fffdf8" stroke="#89a6bd"/><text x="240" y="666" class="label">客户收到加密输出后解密</text><text x="240" y="696" class="note">秘密解密密钥始终留在客户端</text></svg>