<svg xmlns="http://www.w3.org/2000/svg" width="480" height="686" viewBox="0 0 480 686" role="img" aria-labelledby="title desc"><title id="title">TEE · 边界内明文计算</title><desc id="desc">客户端通过加密通道向保护环境交付输入；获准软件读取明文，推理后加密返回。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#89a6bd"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#173f63}.title{font-family:Georgia,"Songti SC",serif;font-size:27px;font-weight:700}.label{font-size:24px;font-weight:600}.note{font-size:22px;fill:#52697b}.card{fill:#fffdf8;stroke:#89a6bd;stroke-width:1.3}.arrow{fill:none;stroke:#89a6bd;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="480" height="686" rx="16" fill="#fbf7ef"/>
<text x="240" y="46" class="title" text-anchor="middle">TEE · 边界内明文计算</text>
<rect x="28" y="82" width="424" height="76" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.3"/>
<text x="240.0" y="113" class="label" text-anchor="middle">企业客户端</text>
<text x="240.0" y="142" class="note" text-anchor="middle">准备明文输入</text>
<path d="M90 158 V202" class="arrow"/>
<text x="240" y="192" class="note" text-anchor="middle" style="fill:#1f7a57">加密请求</text>
<rect x="20" y="216" width="440" height="282" rx="12" fill="#edf4f7" stroke="#1f7a57" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="240" y="248" class="label" text-anchor="middle" style="fill:#1f7a57">经过验证的保护边界</text>
<rect x="40" y="268" width="400" height="76" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.3"/>
<text x="240.0" y="299" class="label" text-anchor="middle">解密输入</text>
<text x="240.0" y="328" class="note" text-anchor="middle">明文只交付给边界内获准软件</text>
<rect x="40" y="370" width="400" height="76" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.3"/>
<text x="240.0" y="401" class="label" text-anchor="middle">普通模型推理</text>
<text x="240.0" y="430" class="note" text-anchor="middle">计算结果在边界内加密</text>
<path d="M240 344 V361" class="arrow"/>
<path d="M90 498 V548" class="arrow"/>
<text x="240" y="535" class="note" text-anchor="middle" style="fill:#1f7a57">加密结果</text>
<rect x="28" y="562" width="424" height="76" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.3"/>
<text x="240.0" y="593" class="label" text-anchor="middle">企业客户端</text>
<text x="240.0" y="622" class="note" text-anchor="middle">解密并使用结果</text>
</svg>
