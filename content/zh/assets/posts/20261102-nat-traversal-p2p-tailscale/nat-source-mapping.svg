<svg xmlns="http://www.w3.org/2000/svg" width="640" height="392" viewBox="0 0 640 392" role="img" aria-labelledby="title desc">
<title id="title">出站数据的来源转换</title><desc id="desc">网关将内部来源 192.168.1.10:50000 转换为 203.0.113.10:62000。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="392" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">出站数据的来源转换</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="48" y="100" width="544" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="134" text-anchor="middle" font-size="23" fill="#173f63">内部来源</text><text x="320.0" y="165" text-anchor="middle" font-size="19" fill="#6f7f8d">192.168.1.10:50000</text><path d="M320 197 L320 228" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="240" width="544" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="274" text-anchor="middle" font-size="23" fill="#173f63">NAT 转换后的外部来源</text><text x="320.0" y="305" text-anchor="middle" font-size="19" fill="#6f7f8d">203.0.113.10:62000</text><text x="320" y="365" text-anchor="middle" font-size="20" fill="#6f7f8d">返回包还需匹配有效映射，并满足入站规则</text></g></svg>
