<svg xmlns="http://www.w3.org/2000/svg" width="640" height="697" viewBox="0 0 640 697" role="img" aria-labelledby="title desc">
<title id="title">P2P 连接管理与恢复</title><desc id="desc">确认设备身份与访问权限；交换地址，收集直接和中继候选；检查直接路径；限制探测时间和并发；建立可用中继；支持尽早开始通信；选择可用路径；传输加密数据；监测质量 · 必要时切换并回收旧状态。分支表示可以同时进行的工作。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="697" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">P2P 连接管理与恢复</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="48" y="104" width="544" height="84" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="138" text-anchor="middle" font-size="23" fill="#173f63">确认设备身份与访问权限</text><text x="320.0" y="169" text-anchor="middle" font-size="19" fill="#6f7f8d">交换地址，收集直接和中继候选</text><path d="M320 199 L320 226" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M162 249 V227 H478 V249" fill="none" stroke="#173f63" stroke-width="2"/><rect x="32" y="262" width="276" height="100" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="170.0" y="296" text-anchor="middle" font-size="23" fill="#173f63">检查直接路径</text><text x="170.0" y="327" text-anchor="middle" font-size="19" fill="#6f7f8d">限制探测时间和并发</text><rect x="332" y="262" width="276" height="100" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="470.0" y="296" text-anchor="middle" font-size="23" fill="#173f63">建立可用中继</text><text x="470.0" y="327" text-anchor="middle" font-size="19" fill="#6f7f8d">支持尽早开始通信</text><path d="M170 376 V402 H470 V376 M320 402 V428" fill="none" stroke="#173f63" stroke-width="2"/><rect x="48" y="442" width="544" height="100" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="476" text-anchor="middle" font-size="23" fill="#173f63">选择可用路径</text><text x="320.0" y="507" text-anchor="middle" font-size="19" fill="#6f7f8d">传输加密数据</text><path d="M320 555 L320 585" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="599" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="640.0" text-anchor="middle" font-size="23" fill="#173f63">监测质量 · 必要时切换并回收旧状态</text></g></svg>
