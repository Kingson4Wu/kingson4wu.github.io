<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" role="img" aria-labelledby="title desc">
<title id="title">明确配置入站转发</title><desc id="desc">端口转发将网关外部端口60000收到的数据转给内部设备端口50000。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="510" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">明确配置入站转发</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="48" y="100" width="544" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="134" text-anchor="middle" font-size="23" fill="#173f63">外部接收端点</text><text x="320.0" y="165" text-anchor="middle" font-size="19" fill="#6f7f8d">203.0.113.10:60000</text><path d="M320 197 L320 228" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="240" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="281.0" text-anchor="middle" font-size="23" fill="#173f63">网关 · 端口转发</text><path d="M320 315 L320 346" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="358" width="544" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="392" text-anchor="middle" font-size="23" fill="#173f63">内部接收端点</text><text x="320.0" y="423" text-anchor="middle" font-size="19" fill="#6f7f8d">192.168.1.10:50000</text><text x="320" y="483" text-anchor="middle" font-size="20" fill="#6f7f8d">网关、主机防火墙及接收服务仍需允许通信</text></g></svg>
