<svg xmlns="http://www.w3.org/2000/svg" width="640" height="492" viewBox="0 0 640 492" role="img" aria-labelledby="title desc">
<title id="title">通过服务器转发</title><desc id="desc">设备 A 和设备 B 分别连接中继服务器，业务数据经中继转发。双方分别建立可用的通信路径</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="492" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">通过服务器转发</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="48" y="108" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="149.0" text-anchor="middle" font-size="23" fill="#173f63">设备 A</text><path d="M320 187 L320 226" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="48" y="240" width="544" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="274" text-anchor="middle" font-size="23" fill="#173f63">中继服务器</text><text x="320.0" y="305" text-anchor="middle" font-size="19" fill="#6f7f8d">双方分别建立可用的通信路径</text><path d="M320 341 L320 380" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="48" y="394" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="435.0" text-anchor="middle" font-size="23" fill="#173f63">设备 B</text></g></svg>
