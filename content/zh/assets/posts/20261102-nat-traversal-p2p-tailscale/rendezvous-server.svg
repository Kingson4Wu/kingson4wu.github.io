<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">双方先联系公网服务器</title><desc id="desc">电脑A和B分别通过自己的NAT网关向公网服务器S发包，S观察并交换外部端点。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="560" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">双方先联系公网服务器</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="32" y="110" width="260" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="162.0" y="144" text-anchor="middle" font-size="23" fill="#173f63">电脑 A</text><text x="162.0" y="175" text-anchor="middle" font-size="19" fill="#6f7f8d">192.168.1.10</text><rect x="348" y="110" width="260" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="478.0" y="144" text-anchor="middle" font-size="23" fill="#173f63">电脑 B</text><text x="478.0" y="175" text-anchor="middle" font-size="19" fill="#6f7f8d">192.168.2.20</text><path d="M162 211 L162 251" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M478 211 L478 251" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="265" width="260" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="162.0" y="306.0" text-anchor="middle" font-size="23" fill="#173f63">路由器 A · NAT</text><rect x="348" y="265" width="260" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="478.0" y="306.0" text-anchor="middle" font-size="23" fill="#173f63">路由器 B · NAT</text><path d="M162 345 L260 425" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M478 345 L380 425" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="440" width="320" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="474" text-anchor="middle" font-size="23" fill="#173f63">公网服务器 S</text><text x="320.0" y="505" text-anchor="middle" font-size="19" fill="#6f7f8d">观察来源并交换地址</text></g></svg>
