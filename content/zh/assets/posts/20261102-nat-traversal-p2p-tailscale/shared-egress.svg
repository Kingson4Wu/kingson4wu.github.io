<svg xmlns="http://www.w3.org/2000/svg" width="640" height="499" viewBox="0 0 640 499" role="img" aria-labelledby="title desc">
<title id="title">多 Socket 仍可能共享瓶颈</title><desc id="desc">多个Socket通过同一个出口使用共享链路；多开Socket不会增加已饱和链路的容量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="499" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">多 Socket 仍可能共享瓶颈</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="32" y="108" width="290" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="177.0" y="149.0" text-anchor="middle" font-size="23" fill="#173f63">Socket 1</text><path d="M336 141 H370" fill="none" stroke="#173f63" stroke-width="2"/><rect x="32" y="200" width="290" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="177.0" y="241.0" text-anchor="middle" font-size="23" fill="#173f63">Socket 2</text><path d="M336 233 H370" fill="none" stroke="#173f63" stroke-width="2"/><rect x="32" y="292" width="290" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="177.0" y="333.0" text-anchor="middle" font-size="23" fill="#173f63">Socket 3</text><path d="M336 325 H370" fill="none" stroke="#173f63" stroke-width="2"/><path d="M370 141 V325" fill="none" stroke="#173f63" stroke-width="2"/><path d="M370 233 L400 233" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="414" y="170" width="194" height="126" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="511.0" y="241.0" text-anchor="middle" font-size="23" fill="#173f63">同一出口</text><path d="M510 310 L510 370" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="389" width="544" height="78" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="436.0" text-anchor="middle" font-size="23" fill="#173f63">共享链路 · 容量不会因端口增加而扩大</text></g></svg>
