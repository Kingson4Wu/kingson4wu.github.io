<svg xmlns="http://www.w3.org/2000/svg" width="640" height="697" viewBox="0 0 640 697" role="img" aria-labelledby="title desc">
<title id="title">Tailscale 的路径发现与切换</title><desc id="desc">取得对端身份、公钥和连接信息；已有可信直连时可直接复用；借助 DERP；协商与初始通信；探测 UDP 直连；与中继通信可同时进行；可用直连优先；否则使用可用 Peer Relay 或 DERP；持续监测 · 必要时重新选路。分支表示可以同时进行的工作。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="697" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">Tailscale 的路径发现与切换</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="48" y="104" width="544" height="84" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="138" text-anchor="middle" font-size="23" fill="#173f63">取得对端身份、公钥和连接信息</text><text x="320.0" y="169" text-anchor="middle" font-size="19" fill="#6f7f8d">已有可信直连时可直接复用</text><path d="M320 199 L320 226" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M162 249 V227 H478 V249" fill="none" stroke="#173f63" stroke-width="2"/><rect x="32" y="262" width="276" height="100" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="170.0" y="296" text-anchor="middle" font-size="23" fill="#173f63">借助 DERP</text><text x="170.0" y="327" text-anchor="middle" font-size="19" fill="#6f7f8d">协商与初始通信</text><rect x="332" y="262" width="276" height="100" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="470.0" y="296" text-anchor="middle" font-size="23" fill="#173f63">探测 UDP 直连</text><text x="470.0" y="327" text-anchor="middle" font-size="19" fill="#6f7f8d">与中继通信可同时进行</text><path d="M170 376 V402 H470 V376 M320 402 V428" fill="none" stroke="#173f63" stroke-width="2"/><rect x="48" y="442" width="544" height="100" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="476" text-anchor="middle" font-size="23" fill="#173f63">可用直连优先</text><text x="320.0" y="507" text-anchor="middle" font-size="19" fill="#6f7f8d">否则使用可用 Peer Relay 或 DERP</text><path d="M320 555 L320 585" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="599" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="640.0" text-anchor="middle" font-size="23" fill="#173f63">持续监测 · 必要时重新选路</text></g></svg>
