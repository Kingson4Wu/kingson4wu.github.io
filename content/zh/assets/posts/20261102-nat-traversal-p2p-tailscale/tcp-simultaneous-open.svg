<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="title desc">
<title id="title">TCP 同时打开 · 简化交互</title><desc id="desc">设备 A与设备 B按时间从上到下交互。SYN · seq=a，双方的 SYN 在途中交错；SYN · seq=b；SYN+ACK · seq=a, ack=b+1；SYN+ACK · seq=b, ack=a+1。双方进入已建立状态 · 省略重传</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="680" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">TCP 同时打开 · 简化交互</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="32" y="104" width="250" height="64" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="157.0" y="144.0" text-anchor="middle" font-size="23" fill="#173f63">设备 A</text><rect x="358" y="104" width="250" height="64" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="483.0" y="144.0" text-anchor="middle" font-size="23" fill="#173f63">设备 B</text><path d="M95 185 L95 615" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 7"/><path d="M545 185 L545 615" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 7"/><text x="320" y="204" text-anchor="middle" font-size="20" fill="#6f7f8d">SYN 在途中交错 · 双方均先主动发送</text><text x="115" y="238" text-anchor="start" font-size="20" fill="#173f63">SYN · seq=a</text><text x="525" y="238" text-anchor="end" font-size="20" fill="#173f63">SYN · seq=b</text><path d="M105 255 L535 345" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M535 255 L105 345" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="383" text-anchor="middle" font-size="20" fill="#6f7f8d">双方收到 SYN 后，分别发送 SYN+ACK</text><text x="115" y="420" text-anchor="start" font-size="19" fill="#173f63">seq=a, ack=b+1</text><text x="525" y="420" text-anchor="end" font-size="19" fill="#173f63">seq=b, ack=a+1</text><path d="M105 437 L535 527" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M535 437 L105 527" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="575" text-anchor="middle" font-size="20" fill="#1f7a57">收到对方的 SYN+ACK 后进入 ESTABLISHED</text><text x="320" y="650" text-anchor="middle" font-size="20" fill="#1f7a57">双方进入已建立状态 · 省略重传</text></g></svg>
