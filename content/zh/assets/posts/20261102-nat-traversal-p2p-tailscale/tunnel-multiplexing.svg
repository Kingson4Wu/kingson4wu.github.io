<svg xmlns="http://www.w3.org/2000/svg" width="640" height="499" viewBox="0 0 640 499" role="img" aria-labelledby="title desc">
<title id="title">多个业务共用外层隧道</title><desc id="desc">SSH、文件传输、音视频各自维护状态，内层数据包经隧道封装，共用外层传输路径。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="499" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">多个业务共用外层隧道</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="32" y="108" width="290" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="177.0" y="149.0" text-anchor="middle" font-size="23" fill="#173f63">SSH · TCP 连接</text><path d="M336 141 H370" fill="none" stroke="#173f63" stroke-width="2"/><rect x="32" y="200" width="290" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="177.0" y="241.0" text-anchor="middle" font-size="23" fill="#173f63">文件传输 · TCP 连接</text><path d="M336 233 H370" fill="none" stroke="#173f63" stroke-width="2"/><rect x="32" y="292" width="290" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="177.0" y="333.0" text-anchor="middle" font-size="23" fill="#173f63">音视频 · UDP 数据流</text><path d="M336 325 H370" fill="none" stroke="#173f63" stroke-width="2"/><path d="M370 141 V325" fill="none" stroke="#173f63" stroke-width="2"/><path d="M370 233 L400 233" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="414" y="170" width="194" height="126" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="511.0" y="241.0" text-anchor="middle" font-size="23" fill="#173f63">隧道封装</text><path d="M510 310 L510 370" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="389" width="544" height="78" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="436.0" text-anchor="middle" font-size="23" fill="#173f63">外层传输路径 · 业务数据交错收发</text></g></svg>
