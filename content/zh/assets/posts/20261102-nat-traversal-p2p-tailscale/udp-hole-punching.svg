<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="title desc">
<title id="title">UDP 打洞：出站探测与重试</title><desc id="desc">A / 路由器 A与路由器 B / B按时间从上到下交互。① A 首次探测 B，A 端已有状态；B 端尚未放行，丢弃；② B 主动探测 A，B 端建立状态；数据有机会到达 A；③ A 重试或应答，B 端已有相应状态，允许通过；④ 双向直接通信，验证探测应答后，沿用这些 UDP 端点。前提：映射适用，过滤与网络策略允许</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="680" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">UDP 打洞：出站探测与重试</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="32" y="104" width="250" height="64" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="157.0" y="144.0" text-anchor="middle" font-size="23" fill="#173f63">A / 路由器 A</text><rect x="358" y="104" width="250" height="64" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="483.0" y="144.0" text-anchor="middle" font-size="23" fill="#173f63">路由器 B / B</text><path d="M95 185 L95 615" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 7"/><path d="M545 185 L545 615" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 7"/><text x="320" y="211" text-anchor="middle" font-size="21" fill="#9a3b2f">① A 首次探测 B</text><path d="M105 228 L535 228" fill="none" stroke="#9a3b2f" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="258" text-anchor="middle" font-size="19" fill="#6f7f8d">A 端已有状态；B 端尚未放行，丢弃</text><text x="320" y="311" text-anchor="middle" font-size="21" fill="#173f63">② B 主动探测 A</text><path d="M535 328 L105 328" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="358" text-anchor="middle" font-size="19" fill="#6f7f8d">B 端建立状态；数据有机会到达 A</text><text x="320" y="411" text-anchor="middle" font-size="21" fill="#173f63">③ A 重试或应答</text><path d="M105 428 L535 428" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="458" text-anchor="middle" font-size="19" fill="#6f7f8d">B 端已有相应状态，允许通过</text><text x="320" y="511" text-anchor="middle" font-size="21" fill="#1f7a57">④ 双向直接通信</text><path d="M105 528 L535 528" fill="none" stroke="#1f7a57" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="320" y="558" text-anchor="middle" font-size="19" fill="#6f7f8d">验证探测应答后，沿用这些 UDP 端点</text><text x="320" y="650" text-anchor="middle" font-size="20" fill="#1f7a57">前提：映射适用，过滤与网络策略允许</text></g></svg>
