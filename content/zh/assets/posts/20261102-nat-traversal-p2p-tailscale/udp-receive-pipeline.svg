<svg xmlns="http://www.w3.org/2000/svg" width="640" height="702" viewBox="0 0 640 702" role="img" aria-labelledby="title desc">
<title id="title">常见的内核 UDP 接收路径</title><desc id="desc">UDP数据依次经过网卡队列、IP和UDP处理、Socket缓冲、应用读取与业务处理；每个环节均可能成为瓶颈。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="702" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">常见的内核 UDP 接收路径</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="48" y="100" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="141.0" text-anchor="middle" font-size="23" fill="#173f63">网卡接收队列</text><path d="M320 175 L320 206" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="218" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="259.0" text-anchor="middle" font-size="23" fill="#173f63">IP / UDP 处理</text><path d="M320 293 L320 324" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="336" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="377.0" text-anchor="middle" font-size="23" fill="#173f63">Socket 接收缓冲</text><path d="M320 411 L320 442" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="454" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="495.0" text-anchor="middle" font-size="23" fill="#173f63">应用读取</text><path d="M320 529 L320 560" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="572" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="613.0" text-anchor="middle" font-size="23" fill="#173f63">协议解析与业务处理</text><text x="320" y="675" text-anchor="middle" font-size="20" fill="#6f7f8d">过滤和 Socket 分发等工作穿插其中</text></g></svg>
