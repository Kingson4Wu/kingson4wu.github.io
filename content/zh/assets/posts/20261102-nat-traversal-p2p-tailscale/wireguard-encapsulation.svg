<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="title desc">
<title id="title">SSH 经 UDP 直连隧道传输</title><desc id="desc">SSH的内层TCP/IP数据经过WireGuard加密，以外层UDP直连送到B；B解密后交给协议栈与SSH服务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="640" height="830" rx="20" fill="#fbf7ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="48" text-anchor="start" font-size="27" fill="#173f63">SSH 经 UDP 直连隧道传输</text><path d="M32 72 H608" stroke="#d9dfdf"/><rect x="48" y="100" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="141.0" text-anchor="middle" font-size="23" fill="#173f63">A 的 SSH 客户端</text><path d="M320 175 L320 206" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="218" width="544" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="252" text-anchor="middle" font-size="23" fill="#173f63">内层 TCP/IP</text><text x="320.0" y="283" text-anchor="middle" font-size="19" fill="#6f7f8d">100.64.0.1 → 100.64.0.2:22</text><path d="M320 315 L320 346" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="358" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="399.0" text-anchor="middle" font-size="23" fill="#173f63">WireGuard 加密与封装</text><path d="M320 433 L320 464" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="476" width="544" height="88" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="510" text-anchor="middle" font-size="23" fill="#173f63">外层 UDP</text><text x="320.0" y="541" text-anchor="middle" font-size="19" fill="#6f7f8d">A 的实际端点 → B 的实际端点</text><path d="M320 573 L320 604" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="616" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="657.0" text-anchor="middle" font-size="23" fill="#173f63">B 解密 · 恢复内层 IP 数据包</text><path d="M320 691 L320 722" fill="none" stroke="#173f63" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="734" width="544" height="66" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.4"/><text x="320.0" y="775.0" text-anchor="middle" font-size="23" fill="#173f63">B 的协议栈与 SSH 服务</text></g></svg>
